      background: >-
        What brought me to this topic was a broader interest in understanding what board
        certification and certification examination performance mean beyond simply passing an
        examination. From a psychometric and research perspective, we spend considerable effort
        ensuring that certification assessments are valid and defensible, but an important question
        is whether certification outcomes are also associated with meaningful outcomes later in
        physicians’ professional careers.


        The DANS data provided an opportunity to examine that question longitudinally. In
        particular, we were interested in whether achieving ABPN certification, and performance on
        the initial certification examination, were associated with subsequent disciplinary events.
        For me, the intellectual motivation was to connect assessment performance with longer-term
        professional outcomes and contribute evidence about the broader validity and value of
        certification.
      contribution: >-
        The novel contribution of this study is that it moves beyond examining certification as an
        endpoint and asks whether certification status and initial certification examination
        performance are associated with physicians’ subsequent professional disciplinary events.


        Using longitudinal DANS data spanning several decades, the study examines both the
        occurrence and timing of disciplinary events and whether higher initial certification
        performance is associated with lower risk. This provides a different type of validity
        evidence for certification by connecting assessment outcomes with meaningful professional
        outcomes later in a physician’s career.


        This matters because certification examinations are intended to identify physicians who have
        demonstrated the knowledge and competencies expected for independent practice. Evidence that
        certification achievement and examination performance are associated with longer-term
        professional outcomes would help us better understand the broader meaning and value of
        certification.
      chapters:
        - id: david
          title: literature
      methodology:
        approach: quantitative
        summary: >-
          This is a retrospective longitudinal study linking ABPN certification and examination data
          with the ABMS Disciplinary Action Notification Service (DANS) data.


          We examine physicians over time to determine whether certification-related measures are
          associated with subsequent disciplinary events. Our primary outcomes are time to the first
          DANS event and time to the first severe DANS event.


          We first describe the incidence of disciplinary events, including rates per 1,000
          person-years and the distribution of action and basis codes. We then use Cox proportional
          hazards models to examine whether certification status and initial certification
          examination performance are associated with the risk of a subsequent disciplinary event,
          while accounting for relevant factors such as IMG status and examination era.


          For the neurology analysis, Neurology and Child Neurology are combined for the primary
          analysis, with separate specialty analyses planned as supplemental analyses. The overall
          goal is not to establish causality, but to determine whether certification and examination
          performance are longitudinally associated with subsequent professional disciplinary
          outcomes.
