          path: raw/background/association between ABS and dans.pdf
          title: association between ABS and dans
          description: >-
            IMPORTANCE Board certification is used as a marker of surgeon quality and
            professionalism.

            Although some research has linked certification in surgery to outcomes, more research is

            needed.

            OBJECTIVE To measure associations between surgeons obtaining American Board of Surgery

            (ABS) certification and examination performance with receiving future severe
            disciplinary

            actions against their medical licenses.

            DESIGN, SETTING, AND PARTICIPANTS Retrospective analysis of severe license action rates
            for

            surgeons who attempted ABS certification based on certification status and examination

            performance. Surgeons who attempted to become certified were classified as certified or

            failing to obtain certification. Additionally, groups were further categorized based on
            whether

            the surgeon had to repeat examinations and whether they ultimately passed. The study

            included surgeons who initially attempted certification between 1976 and 2017 (n = 44
            290).

            Severe license actions from 1976 to 2018 were obtained from the Federation of State
            Medical

            Boards, and certification data were obtained from the ABS database. Data were analyzed

            between 1978 and 2008.
